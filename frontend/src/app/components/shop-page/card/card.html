<div class="flex items-center justify-center h-[420px] ">
  <div
    class="group relative w-[240px] h-full bg-white rounded-xl shadow-lg border border-slate-100 overflow-hidden transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 cursor-pointer flex flex-col"
    (click)="goToDetails()">

    <div class="relative h-56 overflow-hidden bg-slate-50 border-b border-slate-100 flex-shrink-0">
      <img [src]="book.bookCoverImage" [alt]="book.title"
        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 cursor-pointer"
        (click)="goToDetails()" />

      <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300"></div>

      <div
        class="absolute top-4 right-4 bg-gradient-to-r from-[var(--primary-color)] to-[var(--secondary-color)] text-white px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider shadow-lg">
        Bestseller
      </div>
    </div>

    <div class="p-4 flex flex-col flex-1">

      <h3
        class="text-base font-bold text-slate-900 leading-tight line-clamp-2 cursor-pointer hover:text-amber-600 transition-colors duration-300 font-serif mb-1"
        (click)="goToDetails()">
        {{ book.title }}
      </h3>

      <p class="text-xs font-medium text-slate-500 tracking-wide mb-auto">
        {{ book.author }}
      </p>

      <!-- <div class="flex items-center gap-2 mt-1">
        <div class="flex gap-0.5">
          <span *ngFor="let star of [1,2,3,4,5]" class="text-amber-400 text-xs">â˜…</span>
        </div>
        <span class="text-[10px] text-slate-500 font-medium">(324)</span>
      </div> -->

      <div class="pt-3 mt-3 border-t border-slate-100 flex items-center justify-between">
        <p class="text-xl font-bold bg-gradient-to-r from-amber-600 to-amber-500 bg-clip-text text-transparent">
          ${{ book.price }}
        </p>
      </div>

      <div class="flex gap-2 pt-3">
        @if(isLogin) {
        <!-- ❤️ Favorite Button -->
        <button (click)="onToggleFavorite($event)" [ngClass]="{
      'bg-red-50 border-red-500 text-red-500': book.isFavorite,
      'border-slate-100 text-slate-400 hover:border-red-500 hover:text-red-500 hover:bg-red-50': !book.isFavorite
    }" class="flex-shrink-0 p-2 rounded-lg transition-all duration-300 border-2 cursor-pointer">
          <svg class="w-4 h-4" [attr.fill]="book.isFavorite ? 'currentColor' : 'none'" stroke="currentColor"
            stroke-width="2" viewBox="0 0 24 24">
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
          </svg>
        </button>

        <!-- 🛒 Add to Cart -->
        <button (click)="onAddToCart($event)"
          [disabled]="isAddingToCart"
          class="cursor-pointer flex-1 bg-[var(--primary-color)] hover:to-amber-700 text-white text-xs font-semibold py-2 px-3 rounded-lg transition-all duration-300 flex items-center justify-center gap-1.5 shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-md">
          @if (isAddingToCart) {
            <svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Adding...
          } @else {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            Add to Cart
          }
        </button>
        } @else {
        <button (click)="gotoLogin($event)"
          class="cursor-pointer flex-1 bg-[var(--primary-color)] hover:to-amber-700 text-white text-xs font-semibold py-2 px-3 rounded-lg transition-all duration-300 flex items-center justify-center gap-1.5 shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          Buy
        </button>
        }
      </div>

    </div>
    <div
      class="absolute -bottom-20 -right-20 w-40 h-40 bg-amber-400/10 rounded-full blur-3xl group-hover:bg-amber-400/20 transition-colors duration-500">
    </div>
  </div>
</div>
