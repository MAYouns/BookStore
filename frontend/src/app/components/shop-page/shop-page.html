<div class="mt-12 flex flex-col items-center">
  <h1 class="primary-color bona-nova-bold text-5xl text-center mb-8">Explore All Books Here</h1>

  <div class="w-11/12 mt-7">
    <app-filter (filterChange)="onFilterChange($event)"></app-filter>
  </div>

  <div class="w-11/12 mt-6 flex justify-between items-center">
    <p class="text-gray-600 text-lg">
      Showing <span class="font-semibold text-gray-800">{{ filteredBooks.length }}</span>
      of <span class="font-semibold text-gray-800">{{ books.length }}</span> books
    </p>

    <div class="flex items-center gap-2">
      <button class="flex items-center gap-2 bg-red-50 border-2 border-red-500 text-red-500 px-4 py-2 rounded-xl hover:bg-red-100 transition-all duration-300 shadow-md">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span class="font-semibold">{{ favoritesCount }}</span>
        <span class="text-sm">Favorite{{ favoritesCount !== 1 ? 's' : '' }}</span>
      </button>
    </div>
  </div>

  <div class="grid space-x-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 sm:gap-y-10 md:gap-y-10 w-11/12 xl:gap-10 justify-center mt-6">
    <app-card
      *ngFor="let book of filteredBooks"
      [book]="book"
      (addToCart)="onAddToCart($event)"
      (toggleFavorite)="onToggleFavorite($event)">
    </app-card>
  </div>

  <div *ngIf="filteredBooks.length === 0" class="mt-16 text-center">
    <svg class="mx-auto h-24 w-24 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <h3 class="mt-4 text-2xl font-semibold text-gray-900">No books found</h3>
    <p class="mt-2 text-gray-600">Try adjusting your filters to find what you're looking for.</p>
  </div>
</div>
